<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; display: flex; background: #f8f2e7; font-family: Montserrat, sans-serif; }
  .photo { width: 520px; height: 630px; background: url("../assets/poster.jpg") center 62% / cover; position: relative; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(248,242,231,0) 70%, #f8f2e7); }
  .text { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 50px; position: relative; }
  .text::before { content: ""; position: absolute; inset: 34px 34px 34px 0; border: 1.5px solid rgba(181,138,60,.45); border-radius: 260px 260px 18px 18px; }
  .kicker { font-size: 18px; letter-spacing: .45em; text-transform: uppercase; color: #8a6420; }
  h1 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 130px; line-height: 1; margin: 22px 0 6px;
       background: linear-gradient(100deg, #6e4c12, #a87a2c 35%, #d9b86c 50%, #a87a2c 65%, #6e4c12); -webkit-background-clip: text; color: transparent; }
  .names { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 48px; color: #4a3b2a; }
  .orn { width: 220px; color: #b58a3c; margin: 24px 0; }
  .place { font-size: 20px; letter-spacing: .12em; color: #7a6650; }
</style></head>
<body>
  <div class="photo"></div>
  <div class="text">
    <div class="kicker">Шақыру</div>
    <h1>Құдалық</h1>
    <svg class="orn" viewBox="0 0 200 40"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M100 6c-6 0-10 5-10 10s4 9 9 9c4 0 7-3 7-7 0-3-2-5-5-5"/><path d="M100 6c6 0 10 5 10 10s-4 9-9 9"/><path d="M90 16c-8 0-14-6-22-6-7 0-11 5-11 10 0 4 3 7 7 7 3 0 5-2 5-5"/><path d="M110 16c8 0 14-6 22-6 7 0 11 5 11 10 0 4-3 7-7 7-3 0-5-2-5-5"/><path d="M57 20H8M143 20h49"/></g><g fill="currentColor"><circle cx="6" cy="20" r="2"/><circle cx="194" cy="20" r="2"/><path d="M100 0l3 3-3 3-3-3z"/></g></svg>
    <div class="place">Oyu Hall · Астана</div>
  </div>
</body></html>
